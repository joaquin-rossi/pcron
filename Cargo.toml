[package]
name = "pcron"
description = "Probabilistic cron: run commands at random intervals drawn from probability distributions"
authors = ["Joaquín Rossi"]
version = "0.1.0"
edition = "2024"
rust-version = "1.85"
license = "AGPL-3.0-or-later"
repository = "https://github.com/joaquin-rossi/pcron"
documentation = "https://github.com/joaquin-rossi/pcron#readme"
readme = "README.md"
categories = ["command-line-utilities", "date-and-time"]
keywords = ["cron", "scheduler", "random", "probability", "unix"]
# Cargo.toml and Cargo.lock go in anyway
include = ["src/", "tests/", "contrib/", "README.md", "LICENSE"]

[dependencies]
anyhow = "1.0.100"
chrono = "0.4.43"
chrono-tz = "0.10.4"
clap = { version = "4.5.54", features = ["derive", "env"] }
clap_complete = "4.6.11"
clap_mangen = "0.3.3"
libc = "0.2.191"
nom = "8.0.0"
rand = "0.10.3"
rand_distr = "0.5.1"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
tokio = { version = "1.49.0", features = ["io-util", "macros", "process", "rt-multi-thread", "signal", "sync", "time"] }
whoami = "2.1.0"

[profile.release]
strip = true
lto = true
codegen-units = 1
